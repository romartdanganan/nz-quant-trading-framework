# Central configuration for the NZ Quant Trading & Research Framework.
# Secrets (API keys) live in .env — never here.

base_currency: NZD

timezone:
  home: Pacific/Auckland          # NZST/NZDT, DST-aware
  us_market: America/New_York     # NYSE/NASDAQ regular session 09:30-16:00 ET

broker:
  active: alpaca                  # alpaca | ibkr
  ibkr:
    account_type: paper
  alpaca:
    account_type: paper

fx:
  pair: USDNZD
  refresh_interval_minutes: 15
  provider: frankfurter           # frankfurter.dev — free, keyless, official ECB-sourced rates
  cache_path: data/cache/fx_rates.json

research_pipeline:
  cadence: on_demand              # on_demand only — no recurring/scheduled runs
  # Raised from 25 to 100 (2026-08-28) after broadening SEARCH_QUERIES in pipeline.py from
  # 4 to 14 terms: collect_raw_sources() concatenates github results before blog/forum
  # results and truncates once at the very end, so a low cap combined with more queries
  # was silently starving blog/forum sources entirely (github alone could fill the cap).
  # Safe to raise: rule_extractor is free/deterministic regardless of source count, and the
  # separate max_gemini_calls_per_run cap below still bounds the only per-item cost.
  # Raised again to 150 (2026-08-28) after adding arxiv_scraper.py: collect_raw_sources()
  # appends github results first and truncates once at the very end, so a cap too close to
  # github's own yield (up to 14 queries x 5 results = 70) would silently starve arXiv/blog
  # of ever being included, same class of bug as the max_sources_per_run=25 issue above.
  max_sources_per_run: 150         # cap scraped items per pipeline run
  use_gemini_fallback: true
  # Updated 2026-08-28: gemini-2.5-flash returned a live 404 from Google's API ("no longer
  # available to new users... use models/gemini-3.6-flash") during a real pipeline run —
  # confirmed directly from the API response, not guessed. Re-check current free-tier
  # options before assuming this stays valid long-term.
  gemini_model: gemini-3.6-flash
  max_gemini_calls_per_run: 10    # keep well under free-tier daily quota
  seen_sources_cache: data/cache/seen_sources.json

nz_tax:
  fif_threshold_nzd: 50000
  fif_method: auto                # auto | fdr | cv  (auto picks the lower of FDR/CV where election rules allow)
  fdr_rate: 0.05
  tax_year_end: "03-31"           # NZ tax year ends 31 March
  # FDR/CV compute *assessable income* (5% of opening value, or the actual gain) — that
  # income is then taxed at YOUR marginal income tax rate, same as any other income.
  # 0.33 is a reference default (NZ's $70k-$180k bracket); set this to your own real
  # marginal rate for an accurate estimate. Decision-support only, not tax advice.
  marginal_tax_rate: 0.33

validation_thresholds:
  min_sharpe_ratio: 1.5
  max_drawdown_pct: 0.15
  min_profit_factor: 1.3
  apply_nz_tax_drag: true
  apply_fx_fees: true
  fx_fee_pct: 0.005
  # A Sharpe/Profit-Factor estimate from too few trades is close to meaningless (could
  # easily be luck, not edge) — reject on sample size before even looking at the ratios.
  # 20 is a practical minimum, not a rigorous statistical threshold; raise it if you want
  # more confidence at the cost of rejecting more strategies.
  min_trades: 20

# Universe each single-ticker strategy candidate is validated/incubated against (fixes a
# previously-documented limitation: candidates used to all be tested against one hardcoded
# ticker regardless of the strategy). A candidate is promoted using whichever ticker in
# this list gives its best passing result; that ticker is then what gets traded.
strategy_validation:
  universe:
    - SPY
    - AAPL
    - MSFT
    - NVDA
    - TSLA
    - QQQ
    - IWM
    - GLD
    - AMD
    - GOOGL
    - AMZN
    - META
    - XOM
    # Smaller/less-followed names surfaced live by quant_engine/screeners/opportunity_finder.py
    # (2026-08-29) — mega-caps above are the most arbitraged, most efficient tickers in the
    # market, the hardest place for a simple technical rule to find an edge. All confirmed to
    # have >= 2 years of price history (strategy_validation universe needs that for a
    # meaningful backtest, per runner.py's DEFAULT_LOOKBACK_DAYS).
    - COUR
    - KURA
    - ONON
    - CLBK
    - FNKO
    - LENZ
    - PLAB
    - LAC
    - NABL

# Forward-testing / incubation gate (Strategy Lifecycle in CLAUDE.md). A "validated"
# (backtest-passed) strategy must clear this live-but-unfunded forward test before it is
# "proven" and allowed real paper-trading capital. Implemented in Phase 7/8 — values here
# are placeholders to be tuned once the incubation engine exists.
incubation:
  min_days: 60                     # 1-3 months recommended minimum; 30 is an absolute floor, not a target
  min_trades: 20
  max_sharpe_decay_pct: 0.30       # incubation Sharpe may not fall more than 30% below backtest Sharpe
  max_drawdown_overshoot_pct: 0.05 # incubation MaxDD may not exceed backtest MaxDD by more than 5 pts

risk_management:
  position_sizing_method: atr_kelly     # atr | kelly | atr_kelly
  atr_period: 14
  atr_multiplier: 2.0
  kelly_fraction_cap: 0.5               # cap on fractional Kelly to avoid over-leverage
  max_risk_per_trade_pct: 0.01
  max_portfolio_heat_pct: 0.06
  max_position_size_pct: 0.05           # hard ceiling regardless of ATR/Kelly output — never AI-adjusted

# Hardcoded circuit breakers (CLAUDE.md "Hardcoded risk circuit breakers"). Same limits
# apply in paper and live trading. Never tuned or overridden by an LLM at runtime.
circuit_breakers:
  max_daily_loss_pct: 0.02              # halt new entries + flatten (config-dependent) for the day
  require_stop_loss_on_every_order: true

# Fundamental screener + sentiment (Phase 5). Output is advisory only — CLAUDE.md
# Human-in-the-loop: a human reviews and approves before anything here becomes a trade.
screener:
  max_pe: 40.0
  max_peg: 3.0
  max_debt_to_equity: 150.0
  min_revenue_growth: 0.0
  min_earnings_surprise_pct: -5.0
  reward_risk_ratio: 2.0                # target distance = stop distance * this ratio
  sentiment_headline_limit: 10

# Data-driven strategy generation (2026-09-02) — a second discovery path alongside
# research_pipeline above: strategy_research/generator/pattern_miner.py analyses real
# historical OHLCV data directly (decile-bucketed forward-return significance testing) to
# find genuinely new hypotheses, instead of only reading strategies other people published.
pattern_mining:
  # universe defaults to strategy_validation.universe below if unset here.
  forward_return_horizon_days: 5
  decile_count: 10
  min_bucket_size: 30           # min samples per decile bucket for the t-test to be meaningful
  significance_level: 0.05
  # Bonferroni-divides the significance above by the total number of hypotheses ever tested
  # by this module (persisted in data/cache/pattern_mining_stats.json, growing across runs —
  # same reasoning as pairs_trading.multiple_testing_correction below: re-running the miner
  # repeatedly must not be a backdoor to eventually clearing the bar by chance).
  multiple_testing_correction: bonferroni

# Pairs trading (Phase 6). Candidate pairs are seeded from watchlists.pairs_trading below.
pairs_trading:
  cointegration_significance: 0.05      # Engle-Granger p-value must be below this to trade the pair
  # Bonferroni-divides the significance above by the total number of pairs ever tested
  # (registry "kind": "pairs" records, any status) before applying it — added 2026-09-01
  # after broadening the universe to 14 pairs with zero passes made the per-pair false
  # positive risk (~5% at raw alpha=0.05) worth correcting for. Set to "none" to disable.
  multiple_testing_correction: bonferroni
  lookback_period: 30                   # rolling window for the spread z-score
  entry_zscore: 2.0
  exit_zscore: 0.5

watchlists:
  day_trading:
    - AAPL
    - MSFT
    - NVDA
    - TSLA
    - SPY
  swing_trading:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
  pairs_trading:
    - [KO, PEP]
    - [XOM, CVX]
    # Added 2026-08-30 — both original pairs failed cointegration outright (KO/PEP
    # p=0.99, XOM/CVX p=0.146), so broadening to more classic same-sector competitor
    # pairs rather than concluding pairs trading itself doesn't work here.
    - [MA, V]
    - [JPM, BAC]
    - [HD, LOW]
    - [UPS, FDX]
    - [GM, F]
    # Added 2026-09-01 — the 7 pairs above (retail, banking, payments, autos, logistics,
    # energy majors, beverages) all failed cointegration too (closest was GM/F at
    # p=0.060), so broadening further into regulated-duopoly and near-identical-business
    # pairs, which structurally have the tightest long-run price linkage:
    - [T, VZ]        # telecom duopoly, near-identical regulated business + dividend profile
    - [DUK, SO]       # regulated electric utilities, similar rate-base/regulatory-driven growth
    - [UNP, CSX]      # class-I rail duopoly (UNP west, CSX east), near-identical economics
    - [PG, CL]        # consumer staples, near-identical brand/margin/growth profile
    - [WMT, TGT]      # big-box general retail
    - [MCD, YUM]      # quick-service restaurant franchisors
    - [SLB, HAL]      # oilfield services duopoly, both track the same rig-count cycle

data:
  historical_dir: data/historical
  cache_dir: data/cache
  log_dir: data/logs

logging:
  level: INFO
  file: data/logs/app.log
