# Central configuration for the NZ Quant Trading & Research Framework.
# Secrets (API keys) live in .env — never here.

base_currency: NZD

timezone:
  home: Pacific/Auckland          # NZST/NZDT, DST-aware
  us_market: America/New_York     # NYSE/NASDAQ regular session 09:30-16:00 ET

broker:
  active: alpaca                  # alpaca | ibkr
  ibkr:
    account_type: paper
  alpaca:
    account_type: paper

fx:
  pair: USDNZD
  refresh_interval_minutes: 15
  provider: frankfurter           # frankfurter.dev — free, keyless, official ECB-sourced rates
  cache_path: data/cache/fx_rates.json

research_pipeline:
  cadence: on_demand              # on_demand only — no recurring/scheduled runs
  max_sources_per_run: 25         # cap scraped items per pipeline run
  use_gemini_fallback: true
  gemini_model: gemini-2.5-flash  # free-tier model; re-check current free-tier options before use
  max_gemini_calls_per_run: 10    # keep well under free-tier daily quota
  seen_sources_cache: data/cache/seen_sources.json

nz_tax:
  fif_threshold_nzd: 50000
  fif_method: auto                # auto | fdr | cv  (auto picks the lower of FDR/CV where election rules allow)
  fdr_rate: 0.05
  tax_year_end: "03-31"           # NZ tax year ends 31 March
  # FDR/CV compute *assessable income* (5% of opening value, or the actual gain) — that
  # income is then taxed at YOUR marginal income tax rate, same as any other income.
  # 0.33 is a reference default (NZ's $70k-$180k bracket); set this to your own real
  # marginal rate for an accurate estimate. Decision-support only, not tax advice.
  marginal_tax_rate: 0.33

validation_thresholds:
  min_sharpe_ratio: 1.5
  max_drawdown_pct: 0.15
  min_profit_factor: 1.3
  apply_nz_tax_drag: true
  apply_fx_fees: true
  fx_fee_pct: 0.005

# Universe each single-ticker strategy candidate is validated/incubated against (fixes a
# previously-documented limitation: candidates used to all be tested against one hardcoded
# ticker regardless of the strategy). A candidate is promoted using whichever ticker in
# this list gives its best passing result; that ticker is then what gets traded.
strategy_validation:
  universe:
    - SPY
    - AAPL
    - MSFT
    - NVDA
    - TSLA

# Forward-testing / incubation gate (Strategy Lifecycle in CLAUDE.md). A "validated"
# (backtest-passed) strategy must clear this live-but-unfunded forward test before it is
# "proven" and allowed real paper-trading capital. Implemented in Phase 7/8 — values here
# are placeholders to be tuned once the incubation engine exists.
incubation:
  min_days: 60                     # 1-3 months recommended minimum; 30 is an absolute floor, not a target
  min_trades: 20
  max_sharpe_decay_pct: 0.30       # incubation Sharpe may not fall more than 30% below backtest Sharpe
  max_drawdown_overshoot_pct: 0.05 # incubation MaxDD may not exceed backtest MaxDD by more than 5 pts

risk_management:
  position_sizing_method: atr_kelly     # atr | kelly | atr_kelly
  atr_period: 14
  atr_multiplier: 2.0
  kelly_fraction_cap: 0.5               # cap on fractional Kelly to avoid over-leverage
  max_risk_per_trade_pct: 0.01
  max_portfolio_heat_pct: 0.06
  max_position_size_pct: 0.05           # hard ceiling regardless of ATR/Kelly output — never AI-adjusted

# Hardcoded circuit breakers (CLAUDE.md "Hardcoded risk circuit breakers"). Same limits
# apply in paper and live trading. Never tuned or overridden by an LLM at runtime.
circuit_breakers:
  max_daily_loss_pct: 0.02              # halt new entries + flatten (config-dependent) for the day
  require_stop_loss_on_every_order: true

# Fundamental screener + sentiment (Phase 5). Output is advisory only — CLAUDE.md
# Human-in-the-loop: a human reviews and approves before anything here becomes a trade.
screener:
  max_pe: 40.0
  max_peg: 3.0
  max_debt_to_equity: 150.0
  min_revenue_growth: 0.0
  min_earnings_surprise_pct: -5.0
  reward_risk_ratio: 2.0                # target distance = stop distance * this ratio
  sentiment_headline_limit: 10

# Pairs trading (Phase 6). Candidate pairs are seeded from watchlists.pairs_trading below.
pairs_trading:
  cointegration_significance: 0.05      # Engle-Granger p-value must be below this to trade the pair
  lookback_period: 30                   # rolling window for the spread z-score
  entry_zscore: 2.0
  exit_zscore: 0.5

watchlists:
  day_trading:
    - AAPL
    - MSFT
    - NVDA
    - TSLA
    - SPY
  swing_trading:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
  pairs_trading:
    - [KO, PEP]
    - [XOM, CVX]

data:
  historical_dir: data/historical
  cache_dir: data/cache
  log_dir: data/logs

logging:
  level: INFO
  file: data/logs/app.log
